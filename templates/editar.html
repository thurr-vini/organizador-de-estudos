<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Editar Estudo - StudyFlow</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <!-- NAVBAR SIMPLIFICADA -->
    <nav class="bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center gap-2 text-brand-600">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo StudyFlow" class="h-10 w-auto">
                </div>
                
                <!-- Botão Voltar -->
                <a href="/" class="text-gray-500 hover:text-gray-900 font-medium text-sm flex items-center gap-2 transition-colors">
                    <i class="fa-solid fa-arrow-left"></i> 
                    <span class="hidden sm:inline">Voltar ao Painel</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- ÁREA DE EDIÇÃO (Centralizada) -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
        
        <div class="w-full max-w-lg bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            
            <!-- Cabeçalho do Cartão -->
            <div class="bg-brand-50 border-b border-brand-100 p-6 flex items-center gap-4">
                <div class="w-12 h-12 bg-white rounded-xl text-brand-600 flex items-center justify-center text-xl shadow-sm">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-brand-900">Editar Registo</h2>
                    <p class="text-sm text-brand-600 mt-0.5">Atualize as informações do seu estudo.</p>
                </div>
            </div>

            <!-- Formulário -->
            <!-- Note que a action aponta para /editar/ID e o método é POST -->
            <form action="/editar/{{ estudo.id }}" method="POST" class="p-6 space-y-5">
                
                <!-- Matéria -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Matéria / Assunto</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fa-solid fa-book text-gray-400"></i>
                        </div>
                        <!-- O value="{{ estudo.materia }}" preenche o campo com o dado atual do banco -->
                        <input type="text" name="materia" required value="{{ estudo.materia }}" 
                               class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 focus:bg-white transition-colors text-sm">
                    </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                    <!-- Minutos -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Tempo (minutos)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-stopwatch text-gray-400"></i>
                            </div>
                            <input type="number" name="tempo" required min="1" value="{{ estudo.tempo }}" 
                                   class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 focus:bg-white transition-colors text-sm">
                        </div>
                    </div>

                    <!-- Categoria -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Categoria</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-tag text-gray-400"></i>
                            </div>
                            <select name="categoria" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 focus:bg-white transition-colors text-sm appearance-none cursor-pointer">
                                <!-- A lógica do Jinja marca a opção correta como 'selected' baseada no banco -->
                                <option value="Teoria" {% if estudo.categoria == 'Teoria' %}selected{% endif %}>Teoria</option>
                                <option value="Prática" {% if estudo.categoria == 'Prática' %}selected{% endif %}>Prática</option>
                                <option value="Revisão" {% if estudo.categoria == 'Revisão' %}selected{% endif %}>Revisão</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                <i class="fa-solid fa-chevron-down text-gray-400 text-xs"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Botões de Ação -->
                <div class="pt-4 flex flex-col sm:flex-row gap-3">
                    <button type="submit" class="w-full sm:w-auto flex-1 bg-brand-600 hover:bg-brand-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm flex items-center justify-center gap-2 transition-colors">
                        <i class="fa-solid fa-check"></i> Atualizar Estudo
                    </button>
                    <a href="/" class="w-full sm:w-auto flex-1 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-medium py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition-colors text-center">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>
    </main>

</body>
</html>
