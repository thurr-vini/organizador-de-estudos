<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Criar Conta - StudyFlow</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col justify-center items-center p-4 selection:bg-brand-100 selection:text-brand-900">

    <div class="mt-5 mb-8 flex flex-col items-center animate-fade-in-down">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="StudyFlow Logo" class="h-16 w-auto mb-4 object-contain">
        <p class="text-gray-500 font-medium">Organizador de estudos pessoal.</p>
    </div>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-sm border border-gray-100 p-8 sm:p-10">
        <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Criar nova conta</h2>

        {% if erro %}
        <div class="mb-6 p-4 bg-red-50 border border-red-100 rounded-xl flex items-start gap-3 text-red-600 animate-pulse">
            <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
            <p class="text-sm font-medium">{{ erro }}</p>
        </div>
        {% endif %}

        <form action="/cadastro" method="POST" class="space-y-5">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Nome Completo</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-user text-gray-400"></i>
                    </div>
                    <input type="text" name="nome" required placeholder="Ex: Arthur Vinícius"
                           class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 focus:bg-white transition-colors text-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">E-mail</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-regular fa-envelope text-gray-400"></i>
                    </div>
                    <input type="email" name="email" required placeholder="arthur.vinicius@exemplo.com"
                           class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 focus:bg-white transition-colors text-sm">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Senha</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" name="senha" required placeholder="••••••••"
                           class="w-full pl-11 pr-4 py-3.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 bg-gray-50 focus:bg-white transition-colors text-sm">
                </div>
            </div>

            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium py-3.5 rounded-xl shadow-sm transition-colors mt-4 flex justify-center items-center gap-2">
                Criar Conta <i class="fa-solid fa-user-plus text-sm"></i>
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-500">
            Já tem uma conta? 
            <a href="/login" class="font-semibold text-brand-600 hover:text-brand-700 transition-colors">Faça login</a>
        </p>
    </div>

</body>
</html>
